app = "trace"
strategy = "one_for_one"
restart_intensity = { max = 3, within_ms = 5000 }

[nats]
mode = "embedded"

# Prometheus /metrics endpoint (see the observability docs). Optional - remove to disable.
[observability]
metrics_addr = "127.0.0.1:7391"

# The tracing api/db demo in Python. Same behaviour as the Go (aether.toml) and TypeScript
# (aether-ts.toml) variants - one file plays both roles, selected by AETHER_NAME.
[[thrall]]
name = "api"
cmd  = "PYTHONPATH=../../sdk/python .venv/bin/python trace.py"
restart = "permanent"
scope   = "local"

[[thrall]]
name = "db"
cmd  = "PYTHONPATH=../../sdk/python .venv/bin/python trace.py"
restart = "permanent"
scope   = "local"
