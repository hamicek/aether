app = "es"
strategy = "one_for_one"
restart_intensity = { max = 3, within_ms = 5000 }

[nats]
mode = "embedded"
# Persist the embedded JetStream across restarts, so the event log (and thus the rebuilt
# state) survives stopping and starting `aether up`. Without this, embedded storage is wiped.
store_dir = "./.aether-store"

[[thrall]]
name = "account"
cmd  = "../../bin/account"
restart = "permanent"
scope   = "local"
event_log = true
# This log is the source of truth the account rebuilds from, so declare the intent: a retention
# bound would truncate the rebuild, and with "rebuild" the lord rejects one at startup instead of
# corrupting state silently. Use "audit" for a log you only read, never rebuild from.
event_log_use = "rebuild"
# Duplicate window for the event log's Nats-Msg-Id dedup (used by the command-key pattern in the
# handlers). 0 / omitted uses the 2 min default; raise it to cover slower retries. Applied when
# the stream is first created - on an existing store (./.aether-store) delete it to take effect.
# event_log_dedup_window_ms = 600000
