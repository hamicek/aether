app = "contract-demo"
strategy = "one_for_one"
restart_intensity = { max = 3, within_ms = 5000 }

[nats]
mode = "embedded"

# The BFF (TS) validates every incoming measurement against the shared schema at its boundary.
[[thrall]]
name = "bff"
cmd  = "bun run ./bff.ts"
restart = "permanent"
scope   = "local"

# The driver (Go) produces measurements against the same schema and casts them to the BFF.
[[thrall]]
name = "driver"
cmd  = "../../bin/contract-driver"
restart = "transient"
scope   = "local"

# The HTTP edge validates POSTed measurements against the same schema before they reach the ether:
# a malformed body gets a 400 naming the field, a valid one is cast to the BFF. Same contract, a
# third consumer (an external HTTP client) - not a separate mechanism.
[[edge.http]]
name = "api"
addr = ":7391"
route."POST /ingest" = { thrall = "bff", op = "ingest", kind = "cast", schema = "schemas/measurement.schema.json" }
