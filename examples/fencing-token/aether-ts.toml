# Write-side fencing token demo in TypeScript. Same behaviour as the Go (aether.toml) and Python
# (aether-py.toml) variants - a singleton writer stamps ctx.singletonEpoch on each write and the
# resource (a KV bucket) rejects a lower epoch.
app = "demo"
strategy = "one_for_one"

[nats]
mode = "embedded"

[[thrall]]
name = "writer"
cmd  = "bun run ./writer.ts"
restart = "permanent"
scope   = "singleton"
