app = "demo"
strategy = "one_for_one"
restart_intensity = { max = 3, within_ms = 5000 }

[nats]
mode = "embedded"

# Two site sensors in TypeScript, each publishing readings to its own event subject (aether.demo.site-N.evt).
[[thrall]]
name = "site-1"
cmd  = "bun run ./sensor.ts"
restart = "permanent"

[[thrall]]
name = "site-2"
cmd  = "bun run ./sensor.ts"
restart = "permanent"

# The live edge in TypeScript: holds browser SSE connections and pushes each client only its site's events.
[[thrall]]
name = "dashboard"
cmd  = "bun run ./edge.ts"
restart = "permanent"
scope   = "singleton"
