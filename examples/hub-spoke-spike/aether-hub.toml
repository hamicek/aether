# HUB node - the center. The lord connects to the local HUB NATS (:7390, account HUB
# via no_auth_user) and supervises the gateway thrall. On `check` the gateway calls
# both sites cross-node. Run with: aether up -f aether-hub.toml (from the spike root).
app = "demo"
strategy = "one_for_one"

[nats]
mode = "external"
url  = "nats://127.0.0.1:7390"

[[thrall]]
name    = "gateway"
cmd     = "./bin/gateway"
restart = "permanent"
