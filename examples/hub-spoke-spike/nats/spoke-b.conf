# SPOKE-B NATS server - site B (AE-051 spike). Symmetric to spoke-a.conf.
#
# Standalone node bound into account SITE_B (leaf authentication leafB), local
# lord + counterB thrall, JetStream domain "sb".
#
# JetStream store_dir is passed at runtime via `nats-server -sd <dir>`.

server_name: spoke-b
listen: 127.0.0.1:7393

jetstream {
  domain: sb
}

accounts {
  SITE_B {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    exports: [
      { service: "aether.demo.counterB.>" }
    ]
  }
  SYS {}
}

system_account: SYS
no_auth_user: local

leafnodes {
  remotes: [
    {
      url: "nats-leaf://leafB:leafB@127.0.0.1:7391"
      account: SITE_B
    }
  ]
}
