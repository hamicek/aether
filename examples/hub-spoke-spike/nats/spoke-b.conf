# SPOKE-B NATS server - sajta B (AE-051 spike). Symetricke k spoke-a.conf.
#
# Samostatny uzel vazany do account SITE_B (leaf autentizace leafB), lokalni
# lord + thrall counterB, JetStream domena "sb".
#
# JetStream store_dir se predava az za behu pres `nats-server -sd <dir>`.

server_name: spoke-b
listen: 127.0.0.1:7393

jetstream {
  domain: sb
}

accounts {
  SITE_B {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    exports: [
      { service: "aether.demo.counterB.>" }
    ]
  }
  SYS {}
}

system_account: SYS
no_auth_user: local

leafnodes {
  remotes: [
    {
      url: "nats-leaf://leafB:leafB@127.0.0.1:7391"
      account: SITE_B
    }
  ]
}
