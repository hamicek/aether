# SPOKE-A NATS server - site A (AE-051 spike).
#
# Standalone node: its own NATS + its own lord + counterA thrall. Connects to
# the hub as a leaf node, bound into account SITE_A (leafA authentication). The
# local lord connects unauthenticated (no_auth_user) into SITE_A and provisions its
# KV/registry in the local JetStream domain "sa" (per-node, not shared over the leaf).
#
# JetStream store_dir is passed at runtime via `nats-server -sd <dir>`.

server_name: spoke-a
listen: 127.0.0.1:7392

jetstream {
  domain: sa
}

accounts {
  SITE_A {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    exports: [
      { service: "aether.demo.counterA.>" }
    ]
  }
  SYS {}
}

system_account: SYS
no_auth_user: local

leafnodes {
  remotes: [
    {
      url: "nats-leaf://leafA:leafA@127.0.0.1:7391"
      account: SITE_A
    }
  ]
}
