# SPOKE-A NATS server - sajta A (AE-051 spike).
#
# Samostatny uzel: vlastni NATS + vlastni lord + thrall counterA. Pripojuje se
# k hubu jako leaf node, vazany do account SITE_A (autentizace leafA). Lokalni
# lord se pripoji neautentizovane (no_auth_user) do SITE_A a provisionuje svoje
# KV/registry v lokalni JetStream domene "sa" (per-uzel, nesdileno pres leaf).
#
# JetStream store_dir se predava az za behu pres `nats-server -sd <dir>`.

server_name: spoke-a
listen: 127.0.0.1:7392

jetstream {
  domain: sa
}

accounts {
  SITE_A {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    exports: [
      { service: "aether.demo.counterA.>" }
    ]
  }
  SYS {}
}

system_account: SYS
no_auth_user: local

leafnodes {
  remotes: [
    {
      url: "nats-leaf://leafA:leafA@127.0.0.1:7391"
      account: SITE_A
    }
  ]
}
