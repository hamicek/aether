# HUB NATS server - the center of the hub-spoke topology (AE-051 spike).
#
# Hosts the gateway thrall (account HUB) and is the point that sites connect to
# as leaf nodes. Site isolation is by construction: SITE_A and SITE_B do not
# import each other, so a site cannot see another site. HUB imports the data
# plane of both sites, so the center can reach both.
#
# JetStream store_dir is passed at runtime via `nats-server -sd <dir>`.

server_name: hub
listen: 127.0.0.1:7390

jetstream {
  domain: hub
}

leafnodes {
  listen: 127.0.0.1:7391
}

accounts {
  # Center: the local gateway lord connects here (via no_auth_user).
  HUB {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    imports: [
      { service: { account: SITE_A, subject: "aether.demo.counterA.>" } }
      { service: { account: SITE_B, subject: "aether.demo.counterB.>" } }
    ]
  }

  # Site A: on the hub holds only the leaf binding (leafA) and exports its data plane.
  SITE_A {
    jetstream: enabled
    users: [ { user: leafA, password: leafA } ]
    exports: [
      { service: "aether.demo.counterA.>" }
    ]
  }

  # Site B: symmetric to SITE_A.
  SITE_B {
    jetstream: enabled
    users: [ { user: leafB, password: leafB } ]
    exports: [
      { service: "aether.demo.counterB.>" }
    ]
  }

  SYS {}
}

system_account: SYS

# Unauthenticated local connection (gateway lord, CLI probe on :7390) -> HUB.
no_auth_user: local
