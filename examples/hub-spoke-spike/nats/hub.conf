# HUB NATS server - centrala hub-spoke topologie (AE-051 spike).
#
# Hosti gateway thrall (account HUB) a je bodem, ke kteremu se sajty pripojuji
# jako leaf nodes. Izolace sajt je z konstrukce: SITE_A a SITE_B se navzajem
# neimportuji, takze sajta na sajtu nevidi. HUB importuje datovou rovinu obou
# sajt, takze centrala na obe dosahne.
#
# JetStream store_dir se predava az za behu pres `nats-server -sd <dir>`.

server_name: hub
listen: 127.0.0.1:7390

jetstream {
  domain: hub
}

leafnodes {
  listen: 127.0.0.1:7391
}

accounts {
  # Centrala: sem se pripoji lokalni gateway lord (pres no_auth_user).
  HUB {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    imports: [
      { service: { account: SITE_A, subject: "aether.demo.counterA.>" } }
      { service: { account: SITE_B, subject: "aether.demo.counterB.>" } }
    ]
  }

  # Sajta A: na hubu drzi jen leaf vazbu (leafA) a export sve datove roviny.
  SITE_A {
    jetstream: enabled
    users: [ { user: leafA, password: leafA } ]
    exports: [
      { service: "aether.demo.counterA.>" }
    ]
  }

  # Sajta B: symetricky k SITE_A.
  SITE_B {
    jetstream: enabled
    users: [ { user: leafB, password: leafB } ]
    exports: [
      { service: "aether.demo.counterB.>" }
    ]
  }

  SYS {}
}

system_account: SYS

# Neautentizovane lokalni pripojeni (gateway lord, CLI probe na :7390) -> HUB.
no_auth_user: local
