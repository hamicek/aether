# SPOKE-B node - site B. Symmetric to aether-spoke-a.toml: local SPOKE-B NATS
# (:7393, account SITE_B), counterB thrall. Run with: aether up -f aether-spoke-b.toml.
app = "demo"
strategy = "one_for_one"

[nats]
mode = "external"
url  = "nats://127.0.0.1:7393"

[[thrall]]
name    = "counterB"
cmd     = "./bin/counter"
restart = "permanent"
