# SPOKE-A node - site A. The lord connects to the local SPOKE-A NATS (:7392,
# account SITE_A via no_auth_user) and supervises the counterA thrall (counter binary,
# name from AETHER_NAME injected by the lord). Run with: aether up -f aether-spoke-a.toml.
app = "demo"
strategy = "one_for_one"

[nats]
mode = "external"
url  = "nats://127.0.0.1:7392"

[[thrall]]
name    = "counterA"
cmd     = "./bin/counter"
restart = "permanent"
