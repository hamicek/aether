# Polyglot counter demo with the observability endpoint enabled. Bring it up, then:
#   curl -s 127.0.0.1:7391/metrics
# and run with AETHER_LOG_FORMAT=json AETHER_LOG_LEVEL=debug to see structured logs + traces.
app = "demo"
strategy = "one_for_one"
restart_intensity = { max = 3, within_ms = 5000 }

[nats]
mode = "embedded"

[observability]
metrics_addr = "127.0.0.1:7391"

[[thrall]]
name = "counter"
cmd  = "bun run ./counter.ts"
restart = "permanent"
scope   = "local"

[[thrall]]
name = "counter-py"
cmd  = "PYTHONPATH=../../sdk/python .venv/bin/python counter_py.py"
restart = "permanent"
scope   = "local"

[[thrall]]
name = "counter-go"
cmd  = "../../bin/counter-go"
restart = "permanent"
scope   = "local"
