# HUB NATS server - the center, operator-authored (bring-your-own).
#
# aether ergonomizes only the spoke side ([nats.leaf]); the hub side - the multi-account import
# matrix - stays operator NATS config. The hub accepts the sites as leaf nodes, isolates each into
# its own account, and imports each site's data plane so the center can reach both. SITE_A and
# SITE_B do not import each other, so a site cannot see another site (structural isolation).
#
# It also imports each site's curated fleet health (aether._fleet.<site>.>, a stream export the
# spoke emits automatically) so `aether fleet --url <hub>` sees every site across the leaf. Raw
# supervision (aether._lord.>) is never exported, so isolation holds.
#
# Start with:  nats-server -c nats/hub.conf -sd .run/hub-js

server_name: hub
listen: 127.0.0.1:7390

jetstream {
  domain: hub
}

leafnodes {
  listen: 127.0.0.1:7391
}

accounts {
  # Center: an operator client (aether call --url) connects here via no_auth_user and can reach
  # both sites through the service imports below.
  HUB {
    jetstream: enabled
    users: [ { user: local, password: local } ]
    imports: [
      { service: { account: SITE_A, subject: "aether.sitea.>" } }
      { service: { account: SITE_B, subject: "aether.siteb.>" } }
      { stream: { account: SITE_A, subject: "aether._fleet.sitea.>" } }
      { stream: { account: SITE_B, subject: "aether._fleet.siteb.>" } }
    ]
  }

  # Site A: on the hub holds only the leaf binding (leafA) and exports its data plane plus its fleet
  # health. The spoke's embedded server, generated from [nats.leaf], exports the matching
  # aether.sitea.> (service) and aether._fleet.sitea.> (stream) on its side.
  SITE_A {
    jetstream: enabled
    users: [ { user: leafA, password: leafA } ]
    exports: [
      { service: "aether.sitea.>" }
      { stream: "aether._fleet.sitea.>" }
    ]
  }

  # Site B: symmetric to SITE_A.
  SITE_B {
    jetstream: enabled
    users: [ { user: leafB, password: leafB } ]
    exports: [
      { service: "aether.siteb.>" }
      { stream: "aether._fleet.siteb.>" }
    ]
  }

  SYS {}
}

system_account: SYS
no_auth_user: local
