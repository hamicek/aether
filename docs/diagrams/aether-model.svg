<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A lord supervises three thralls written in Go, TypeScript and Python; the thralls communicate over the ether bus (NATS) using call and cast.">
  <rect x="0" y="0" width="640" height="400" rx="16" fill="#0E141D" stroke="#202B39"/>

  <!-- title -->
  <text x="28" y="40" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#E7EDF4">The aether model</text>
  <text x="28" y="61" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#6B7787">Supervision and messaging, over real OS processes, across languages</text>

  <!-- legend -->
  <line x1="430" y1="34" x2="462" y2="34" stroke="#56A6FF" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="470" y="38" font-family="system-ui,sans-serif" font-size="11" fill="#6B7787">supervises / restarts</text>
  <line x1="430" y1="54" x2="462" y2="54" stroke="#2C3A4C" stroke-width="1.5"/>
  <text x="470" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#6B7787">messages (call / cast)</text>

  <!-- lord -->
  <rect x="255" y="94" width="130" height="58" rx="10" fill="#18212E" stroke="#56A6FF" stroke-width="2"/>
  <text x="320" y="122" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#E7EDF4">lord</text>
  <text x="320" y="140" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#6B7787">supervisor</text>

  <!-- supervision links -->
  <path d="M282,152 C210,178 150,196 121,226" fill="none" stroke="#56A6FF" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>
  <path d="M320,152 L320,226" fill="none" stroke="#56A6FF" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>
  <path d="M358,152 C430,178 490,196 519,226" fill="none" stroke="#56A6FF" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.75"/>

  <!-- thralls -->
  <g>
    <rect x="56" y="226" width="130" height="64" rx="10" fill="#18212E" stroke="#2C3A4C" stroke-width="1.5"/>
    <text x="121" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#E7EDF4">thrall</text>
    <text x="121" y="275" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#3FE0C8">Go</text>
  </g>
  <g>
    <rect x="255" y="226" width="130" height="64" rx="10" fill="#18212E" stroke="#2C3A4C" stroke-width="1.5"/>
    <text x="320" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#E7EDF4">thrall</text>
    <text x="320" y="275" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#3FE0C8">TypeScript</text>
  </g>
  <g>
    <rect x="454" y="226" width="130" height="64" rx="10" fill="#18212E" stroke="#2C3A4C" stroke-width="1.5"/>
    <text x="519" y="256" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#E7EDF4">thrall</text>
    <text x="519" y="275" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#3FE0C8">Python</text>
  </g>

  <!-- thrall -> bus -->
  <line x1="121" y1="290" x2="121" y2="322" stroke="#2C3A4C" stroke-width="1.5"/>
  <line x1="320" y1="290" x2="320" y2="322" stroke="#2C3A4C" stroke-width="1.5"/>
  <line x1="519" y1="290" x2="519" y2="322" stroke="#2C3A4C" stroke-width="1.5"/>
  <circle cx="121" cy="322" r="3.5" fill="#3FE0C8"/>
  <circle cx="320" cy="322" r="3.5" fill="#3FE0C8"/>
  <circle cx="519" cy="322" r="3.5" fill="#3FE0C8"/>

  <!-- ether bus -->
  <rect x="28" y="322" width="584" height="40" rx="8" fill="#56A6FF" opacity="0.12"/>
  <line x1="44" y1="342" x2="596" y2="342" stroke="#56A6FF" stroke-width="2" opacity="0.55"/>
  <text x="44" y="346" font-family="ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#56A6FF">the ether · NATS</text>
  <text x="596" y="346" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#9AA8B8">call (sync) · cast (async)</text>
</svg>
