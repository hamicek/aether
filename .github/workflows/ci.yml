name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The TS and Python JetStream tests spawn a real nats-server and skip when it is missing, so both
# jobs install it. Pinned to the version the Go module embeds, so every SDK tests the same server.
env:
  NATS_SERVER_VERSION: v2.10.20

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install nats-server
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-${NATS_SERVER_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - run: bun install
      - run: bun test
        working-directory: sdk/ts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install nats-server
        run: |
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_SERVER_VERSION}/nats-server-${NATS_SERVER_VERSION}-linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nats-server-${NATS_SERVER_VERSION}-linux-amd64" >> "$GITHUB_PATH"
      - run: pip install nats-py aiohttp fastjsonschema
      - run: python -m unittest discover -p '*_test.py'
        working-directory: sdk/python

  # The generated contract types (examples/payload-contract/gen) are derived from the schemas.
  # Regenerate into a temp dir and fail if it differs from what is committed, so a schema change
  # without a regeneration cannot merge. See PAYLOAD-CONTRACT.md (AE-042 §5).
  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go-jsonschema is a build-time tool; it needs a newer Go than the module targets.
          # This only runs the generator, it does not build the project (which stays on 1.23).
          go-version: "1.25"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./codegen.sh "$RUNNER_TEMP/gen"
        working-directory: examples/payload-contract
      - run: diff -ru examples/payload-contract/gen "$RUNNER_TEMP/gen"
